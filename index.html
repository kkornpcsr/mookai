<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>หมูไก่</title>
<base target="_top">
<meta name="theme-color" content="#1E3A8C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="หมูไก่">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
<style>
/* Layout: a ledger book on a desk. Blue cover band per page, white ruled paper with a red margin, coloured paper index tabs (bottom on phone, top on desktop). On wide screens the daily page opens as a two-page spread. */
:root{
  --desk:#E2E6EB; --paper:#FFFFFF; --cover:#1E3A8C;
  --ink:#1D3E9A; --text:#1C1C1C; --pencil:#6A6A6A;
  --rule:#D3E0F3; --margin:#E58A8A; --colrule:#F0C6C6; --hair:#E4E7EC; --tint:#F2F6FD;
  --tab-entry:#F4D35E; --tab-debt:#A7C7E7; --tab-sum:#D9C9EC; --tab-set:#D2D7DC;
  --f:"Sarabun","Sukhumvit Set","Leelawadee UI",system-ui,sans-serif;
  --row:36px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--text);font-family:var(--f);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
.r{font-variant-numeric:tabular-nums}
.grow{flex:1;min-width:0}
.ink{color:var(--ink);font-weight:600}
.pencil{color:var(--pencil)}
.small{font-size:13px}

/* ---------- book, cover, paper ---------- */
.book{max-width:900px;margin:0 auto;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
.book.spread-on{max-width:1240px}
.cover{background:var(--cover);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 12px}
.cover .k{font-size:12px;letter-spacing:.12em;opacity:.8;width:100%}
.cover h1,.cover h2{margin:0;font-size:22px;font-weight:700;line-height:1.25;text-wrap:balance}
.cover .sub{font-size:13.5px;opacity:.88}
.cover .sync{margin-left:auto;font:inherit;font-size:12px;opacity:.85;white-space:nowrap;background:none;border:0;color:inherit;padding:2px 0;cursor:pointer}
.cover .sync[data-s="off"]{opacity:1;background:#FCE8E6;color:#9B1C1C;border-radius:999px;padding:3px 10px;font-weight:600}
.cover .x{margin-left:auto;border:1.5px solid rgb(255 255 255 / .5);background:none;color:#fff;border-radius:5px;width:38px;height:38px;font-size:18px;line-height:1}
.demo{background:#FFF4C2;color:#6B4B00;padding:7px 18px;font-size:13.5px;font-weight:500}
.datepick.notToday .dow{color:#B42318;font-weight:700}
.page{background:var(--paper);position:relative;padding:12px 16px 28px 42px;min-height:60vh}
.page::before,.page::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--margin)}
.page::before{left:26px}.page::after{left:29px}
.spread{display:grid}
@media (min-width:900px){
  .book{padding:22px 24px 48px}
  .cover{border-radius:6px 6px 0 0}
  .page{box-shadow:0 12px 28px rgb(30 40 60 / .12);border-radius:0 0 6px 6px}
}
@media (min-width:1100px){
  .spread{grid-template-columns:1fr 1fr;box-shadow:0 12px 28px rgb(30 40 60 / .12);border-radius:0 0 6px 6px}
  .spread .page{box-shadow:none;border-radius:0}
  .spread .page+.page,.spread .panel{box-shadow:inset 14px 0 14px -12px rgb(0 0 0 / .18)}
}

/* ---------- index tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:4px;padding:0 8px calc(8px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--hair);align-items:flex-start}
.tab{flex:1;border:0;padding:9px 0 9px;font-weight:600;font-size:14.5px;color:#262626;border-radius:0 0 9px 9px;background:var(--c);filter:saturate(.75) brightness(1.04)}
.tab[aria-current="page"]{padding-bottom:15px;filter:none;box-shadow:0 2px 0 rgb(0 0 0 / .08)}
@media (min-width:900px){
  .tabs{position:static;max-width:900px;margin:22px auto -22px;padding:0 24px;background:none;border:0;align-items:flex-end;gap:6px}
  .tabs.spread-on{max-width:1240px}
  .tab{flex:0 0 120px;border-radius:9px 9px 0 0;padding:8px 0}
  .tab[aria-current="page"]{padding:8px 0 13px}
}

/* ---------- ruled tables ---------- */
.lined{width:100%;border-collapse:collapse;table-layout:fixed}
.lined td,.lined th{height:var(--row);border-bottom:1px solid var(--rule);padding:0 6px 4px;vertical-align:bottom;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lined th{font-size:12px;font-weight:600;color:#B54444;text-align:right;border-bottom:1.5px solid var(--margin)}
.lined th:first-child,.lined td:first-child{text-align:left}
.lined.daily td{font-size:14.5px;padding:0 3px 4px}
.lined.daily td:first-child{padding-left:6px}
.lined tr.dayhd td{background:#EEF2FA;color:var(--ink);font-weight:700;font-size:13.5px;white-space:normal;height:auto;padding-top:6px;line-height:1.35}
.tag{display:inline-block;font-size:11.5px;line-height:1;padding:3px 5px;border-radius:4px;background:#FFF1D6;color:#8A5A00;vertical-align:2px}
.lined .n{text-align:right;border-left:1px solid var(--colrule);font-variant-numeric:tabular-nums}
.lined tr.tap{cursor:pointer}
.lined tr.tap:hover td{background:var(--tint)}
.lined tr.sel td{background:#E9F0FC}
.lined tr.tot td{font-weight:700;color:var(--ink);border-top:1.5px solid var(--ink)}
.lined .wrap{white-space:normal}
.dbl{border-bottom:3px double currentColor}
.stamp{display:inline-block;border:1.5px solid currentColor;border-radius:4px;padding:0 5px;font-size:12px;font-weight:700;line-height:1.45;transform:rotate(-4deg);color:var(--ink)}
.owe{color:var(--pencil);font-size:13px}
.lined tr.subrow td{height:30px;font-size:14px;padding-bottom:3px}
.lined tr.subrow td:first-child{padding-left:16px;color:var(--pencil)}
.sug{color:var(--pencil);font-weight:400}
/* น้องบีเกิล: วางเฉพาะมุมปกกับพื้นที่ว่าง ไม่ทับตัวเลข */
.cover{position:relative;z-index:2}
#cover{padding-right:96px}
.peek{position:absolute;right:14px;bottom:-14px;width:72px;height:60px;pointer-events:none;z-index:3}
.peek svg,.peek img,.sticker svg,.sticker img{width:100%;height:100%;display:block;object-fit:contain}
.sticker{display:block;width:120px;height:110px;margin:8px auto 4px}
.sticker.sm{width:72px;height:66px;margin:0}
.empty.with-sticker,.with-sticker{text-align:center}
.with-sticker .sticker{margin:6px auto 8px}
.pinbox .sticker{margin:0 auto}
/* บีเกิลโบกมือ ข้างปุ่มวันนี้ */
.tbeagle{position:relative;display:inline-block;width:72px;height:80px;flex:none;margin:-10px 0}
.tbeagle img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
/* โบกมือ: สลับภาพมือ 2 จังหวะ โบก 4 ที แล้วพักครู่หนึ่ง */
.tbeagle .w1{animation:waveA 3s steps(1) infinite}
.tbeagle .w2{animation:waveB 3s steps(1) infinite}
.tbeagle.single .w1{animation:none}
@keyframes waveA{0%{opacity:1}10%{opacity:0}20%{opacity:1}30%{opacity:0}40%{opacity:1}50%{opacity:0}60%{opacity:1}70%{opacity:0}80%,100%{opacity:1}}
@keyframes waveB{0%{opacity:0}10%{opacity:1}20%{opacity:0}30%{opacity:1}40%{opacity:0}50%{opacity:1}60%{opacity:0}70%{opacity:1}80%,100%{opacity:0}}
/* บีเกิลเดินไปมาใต้ยอดลูกหนี้ */
.headline.walk{border-bottom:0}
.toolbar:has(.walkway){position:relative;min-height:48px}
.walkway{position:absolute;left:170px;right:0;max-width:460px;margin-left:auto;top:50%;height:66px;margin-top:-42px;pointer-events:none}
.walker{position:absolute;bottom:0;left:0;width:80px;height:66px;animation:walk 12s linear infinite}
.walker img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.walker .f1{animation:legsA .5s steps(1) infinite}
.walker .f2{animation:legsB .5s steps(1) infinite}
@keyframes legsA{0%{opacity:1}50%{opacity:0}}
@keyframes legsB{0%{opacity:0}50%{opacity:1}}
@keyframes walk{0%{left:0;transform:scaleX(-1)}48%{left:calc(100% - 80px);transform:scaleX(-1)}50%{left:calc(100% - 80px);transform:scaleX(1)}98%{left:0;transform:scaleX(1)}100%{left:0;transform:scaleX(-1)}}
@media (prefers-reduced-motion:reduce){.tbeagle img,.walker,.walker .f1,.walker .f2{animation:none}.walker .f2,.tbeagle .w2{opacity:0}}
.cutdates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* บีเกิลนอน หน้าสรุป: z ลอยขึ้นทีละตัว + หายใจเบาๆ */
.napper{position:relative;display:inline-block;width:92px;height:70px;flex:none;margin:-8px 4px -8px auto}
.napper img{position:absolute;left:0;bottom:0;width:100%;height:100%;object-fit:contain;transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite}
.napper i{position:absolute;right:4px;top:6px;font-style:normal;font-weight:700;color:#5B3A1E;font-size:13px;line-height:1;opacity:0;animation:zz 3.6s ease-in infinite}
.napper i:nth-of-type(2){animation-delay:1.2s;font-size:15px}
.napper i:nth-of-type(3){animation-delay:2.4s;font-size:18px}
@keyframes zz{0%{transform:translate(0,8px) scale(.6);opacity:0}15%{opacity:1}75%{opacity:.9}100%{transform:translate(14px,-24px) scale(1.15);opacity:0}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.035)}}
@media (prefers-reduced-motion:reduce){.napper img,.napper i{animation:none}.napper i:nth-of-type(3){opacity:1}}
.paidline{display:flex;align-items:center;gap:10px}
.lined tr.cur td{color:var(--pencil)}
.cutbox{display:grid;gap:12px}
.cutbox .sum{display:grid;gap:2px;padding:10px 12px;border:1.5px dashed #9BB0DA;border-radius:6px;background:var(--tint);font-size:15px}
.cutbox .sum b{color:var(--ink);font-size:20px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.peek{transition:transform .25s}.cover:hover .peek{transform:translateY(-3px)}}
.sec{margin:20px 0 4px;font-size:13px;font-weight:700;color:#B54444;letter-spacing:.04em}
.note{font-size:13px;color:var(--pencil);margin:8px 0 0;max-width:68ch}
.empty{padding:22px 4px;color:var(--pencil)}
.empty b{display:block;color:var(--text);font-size:16.5px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:5px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font-weight:600;font-size:15.5px;text-decoration:none;white-space:nowrap}
.btn.solid{background:var(--cover);border-color:var(--cover);color:#fff}
.btn.lg{min-height:50px;font-size:16.5px}
.link{border:0;background:none;color:var(--ink);font-weight:600;padding:6px 2px;text-decoration:underline;text-underline-offset:3px;font-size:14.5px}
.icon{width:40px;height:40px;border:1.5px solid var(--ink);border-radius:5px;background:#fff;color:var(--ink);font-size:18px;line-height:1;padding:0}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:5px;overflow:hidden;max-width:100%}
.seg button{border:0;background:#fff;color:var(--ink);font-weight:600;font-size:14.5px;padding:6px 13px;white-space:nowrap}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg.sm button{padding:5px 11px;font-size:13.5px;min-height:32px}
.fld{border:0;border-bottom:1.5px dotted #8A9BC4;background:transparent;font-weight:600;font-size:18px;color:var(--ink);height:40px;padding:0 4px;width:100%;min-width:0;border-radius:0;text-align:right;font-variant-numeric:tabular-nums}
.fld.l{text-align:left;font-weight:500;font-size:16px}
.fld:focus{outline:none;border-bottom:2px solid var(--ink);background:var(--tint)}
select.fld{text-align:left}
.lbl{font-size:12.5px;color:var(--pencil);display:block}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 14px;margin-bottom:8px}
.datebar{display:flex;align-items:center;gap:6px}
.datepick{position:relative;display:flex;flex-direction:column;padding:0 6px}
.datepick .dow{font-size:12.5px;color:var(--pencil)}
.datepick .dl{font-size:19px;font-weight:700;white-space:nowrap}
.datepick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.prices{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;font-size:14.5px}
.prices label{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.prices .fld{width:64px;height:34px;font-size:17px}
.daysum{font-size:14px;color:var(--pencil);border-bottom:1px solid var(--rule);padding:6px 0;margin-bottom:4px}
.daysum b{color:var(--ink);font-variant-numeric:tabular-nums}
.dsrow{display:flex;align-items:baseline;gap:10px;padding:1px 0}
.dsrow .dsty{flex:0 0 auto;min-width:64px;color:var(--ink)}
.dsrow .dsamt{margin-left:auto;white-space:nowrap}
.dsrow .dsmid{min-width:0}
.dsavg{display:inline-block;color:var(--pencil);font-size:13px;white-space:nowrap}
.dsrow.tot{border-top:1px dashed var(--rule);margin-top:3px;padding-top:4px}
.dayshare{display:flex;justify-content:flex-end;margin-top:8px}

/* ---------- entry panel ---------- */
.panel{display:none}
.panel.open{display:block;position:fixed;inset:0;z-index:40;overflow:auto;background:var(--paper)}
@media (min-width:1100px){
  .panel,.panel.open{display:block;position:static;inset:auto;z-index:auto;overflow:visible;background:var(--paper)}
  .panel .cover{border-radius:0}
  .panel .cover .x{display:none}
  /* iPad แนวนอน: กระดาษฝั่งขวายืดเต็มความสูง เส้นขอบแดงไม่ขาดกลางหน้า */
  .spread .panel,.spread .panel.open{display:flex;flex-direction:column}
  .spread .panel .page{flex:1 0 auto}
}
.panel .page{min-height:0}
.load{border-bottom:1px solid var(--rule);padding:6px 0 8px}
.lhead{display:flex;align-items:center;gap:10px;min-height:34px}
.lhead .amt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700;white-space:nowrap}
.lgrid{display:grid;grid-template-columns:1.25fr .8fr 1fr;gap:10px}
.lextra{display:flex;align-items:flex-end;gap:10px;margin-top:8px}
.lextra label{flex:0 0 34%}
.lextra label + label{flex:1 1 auto}
.lextra .pencil{padding-bottom:10px}
.ddlink{font-size:13.5px;color:var(--pencil);margin-top:4px;min-height:32px}
.pkeep{display:flex;align-items:center;justify-content:flex-end;gap:6px;min-height:32px;font-size:12.5px;color:var(--pencil);cursor:pointer}
.pkeep[hidden]{display:none}
.pkeep input{width:18px;height:18px;margin:0;accent-color:var(--ink);flex:none}
.xbtn{border:0;background:none;color:var(--pencil);width:40px;height:40px;margin:-5px -8px -5px 0;font-size:18px;line-height:1;padding:0}
.frow{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:var(--row);border-bottom:1px solid var(--rule);padding:2px 0}
.frow .v{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;white-space:nowrap}
.frow.total{border-top:1.5px solid var(--ink);border-bottom:0;padding-top:6px}
.frow.total .l{font-weight:700}
.frow.total .v{font-size:23px;font-weight:700}
.payline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;border-bottom:1px solid var(--rule);padding:6px 0}
.payline .fld{font-size:20px}
.hint{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;padding:8px 10px;margin:6px 0;border:1.5px dashed #9BB0DA;border-radius:6px;background:var(--tint);font-size:14.5px}
.hint .btn{min-height:36px;font-size:14px;padding:0 12px}
.warn{color:#8A4B00;font-size:13.5px;padding:4px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.panel-actions{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1.5fr;gap:8px;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 80%,transparent);margin-top:12px}
.panel-actions.one{grid-template-columns:1fr}
/* แท็บรับเงิน: ชื่อ + บรรทัดเล็ก · ยอดค้าง · ปุ่มรับเงิน */
.paylist{border-top:1.5px solid var(--margin)}
.prow{display:flex;align-items:center;gap:8px;min-height:60px;border-bottom:1px solid var(--rule)}
.pwho{flex:1;min-width:0;border:0;background:none;text-align:left;padding:6px 0 6px 6px;display:grid;gap:1px;cursor:pointer;color:var(--text);font:inherit}
.pwho:hover{background:var(--tint)}
.pwho .nm{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pwho .sb{font-size:12.5px;color:var(--pencil);line-height:1.35}
.pwho .sb span{white-space:nowrap}
.pamt{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);white-space:nowrap;font-size:16px}
.pbtn{flex:none;min-height:40px;padding:0 12px;font-size:14.5px}
/* หน้าต่างรับเงิน: หัว (ชื่อ ยอดค้าง) กับท้าย (ยอดรวม + ปุ่มลงรับเงิน) อยู่กับที่ ตรงกลางเลื่อนได้ ปุ่มไม่หลุดจอ */
.modal.paymodal{padding:8px;place-items:start center}
.modal-card.paybox{max-width:440px;padding:0;gap:0;display:flex;flex-direction:column;max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px);overflow:hidden}
/* มือถือ: หน้าต่างสูงคงที่ แตะวันแล้วแถวอื่นกับปุ่มลงรับเงินไม่เลื่อนหนี */
@media (max-width:600px){.modal-card.paybox{height:calc(100vh - 16px);height:calc(100dvh - 16px)}}
.payhead{display:flex;align-items:flex-start;gap:8px;padding:12px 14px 10px;border-bottom:1px solid var(--rule)}
.pht{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:17px}
.pchip{font-size:13px;font-weight:600;color:var(--ink);background:var(--tint);border:1px solid var(--rule);border-radius:999px;padding:1px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pold{flex-basis:100%;font-size:13px;color:var(--pencil)}
.paybody{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px 14px 16px;display:grid;grid-auto-rows:max-content;gap:10px;align-content:start}
.ptot .fld{font-size:26px;height:50px}
.ptot .fld::placeholder{font-size:15px;font-weight:400;color:#9AA5BD}
.prow2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.prow2 > .lbl{width:52px;flex:none}
.prow2 .seg button{min-height:38px}
.pdate{width:auto;flex:1 1 130px;height:38px;font-size:15px;text-align:left;color:var(--pencil);font-weight:500}
.pdate.on{color:var(--ink);font-weight:700}
.pph{display:flex;justify-content:space-between;align-items:baseline;gap:2px 8px;flex-wrap:wrap;margin-top:4px}
.pplist{border:1px solid var(--rule);border-radius:6px}
.pp:first-child{border-radius:6px 6px 0 0}
.pp:last-child{border-radius:0 0 6px 6px}
.pp{border-bottom:1px solid var(--rule);background:var(--paper)}
.pp:last-child{border-bottom:0}
.pp.on{background:#EEF3FC}
.pprow{display:flex;align-items:flex-start;gap:10px;width:100%;min-height:52px;padding:10px;border:0;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.pprow .cb{margin:1px 0 0}
.ppd{flex:1;min-width:0;display:grid;line-height:1.4}

<script>
(() => {
"use strict";
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);

const baht = n => "฿" + money(n);

const clone = o => JSON.parse(JSON.stringify(o));
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

const DOW = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];

const thShort = s => parseISO(s).toLocaleDateString("th-TH", { day: "numeric", month: "short" });

}
const todayISO = () => iso(new Date());
const wide = () => window.matchMedia("(min-width:1100px)").matches;
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const METHODS = ["โอน", "เงินสด"]; // ไม่มีเช็ค (Korn ตัดออก 23 ต.ค.)

/* ---------- น้องบีเกิล: สติกเกอร์ในโฟลเดอร์ stickers/ (ถ้าไม่มีไฟล์ จะซ่อนตัวเอง) ---------- */

}

/* ================= state ================= */
const DEFAULT_SET = { defaultPrice: 86, defaultLivePrice: 0, defaultBuyPrice: 0, weekStart: 2, openingDate: "2026-01-01", roundOffMax: 1000, buyEnabled: false,
  expenseCats: ["ค่าแรง", "ค่าน้ำมัน/ขนส่ง", "ค่าน้ำ-ไฟ", "ค่าซ่อมบำรุง", "ค่าวัสดุสิ้นเปลือง", "อื่นๆ"] };
const S = {
  mode: "demo", demo: false, loaded: false, loadError: null, needPin: false, pinMsg: "", pin: "", pinRequired: false, sheetUrl: "",
  rev: null, saving: 0, offline: false, staleRev: false, outbox: [], cachedAt: null, today: todayISO(),
  customers: [], farms: [], set: clone(DEFAULT_SET), days: {}, dates: [], expenses: [], cuts: {},
  tab: "entry", entryKind: "sale", date: todayISO(), openId: null, draft: null, dirty: false, expDraft: null,
  debtFilter: "owe", detail: null, tick: null, stMode: "week", stAnchor: todayISO(), billOpen: false,
  sumKind: "cash", orderView: "cust", sumMode: "month", sumAnchor: todayISO(), sumFrom: addDays(todayISO(), -6), sumTo: todayISO(),
  pendingRender: false,
};
const K = {
  sale: { key: "lines", label: "ขาย", party: "ลูกค้า", amountLabel: "ขาย", payLabel: "รับเงิน", balLabel: "คงค้าง" },
  buy: { key: "buys", label: "ซื้อหมู", party: "ฟาร์ม", amountLabel: "ซื้อ", payLabel: "จ่ายเงิน", balLabel: "ค้างจ่าย" },
};
const partiesOf = k => k === "sale" ? S.customers : S.farms;
const partyById = (k, id) => partiesOf(k).find(p => p.id === id);
const lineOf = (k, d, id) => { const day = S.days[d]; const m = day && day[K[k].key]; return m ? m[id] : undefined; };

/* ================= accounting logic ================= */
// เงินของแต่ละรอบ = น้ำหนัก × ราคา + ค่าทำต่อตัว (เฉพาะหมูเป็น) − ลดตำหนิ (หมูขาหัก ไม่สมประกอบ)
const isLive = x => !!x && x.t === "หมูเป็น";
const labOf = x => isLive(x) ? num(x.n) * num(x.lab) : 0;
const loadAmt = x => num(x.w) * num(x.p) + labOf(x) - num(x.dd);
function lineTotals(l) {
  const t = { kg: 0, n: 0, kgn: 0, amt: 0, lab: 0, dd: 0, ddn: [], paid: num(l && l.paid), disc: num(l && l.disc), method: (l && l.method) || "เงินสด", by: {} };
  for (const x of (l && l.loads) || []) {
    if (x.skip) continue;
    const w = num(x.w), n = num(x.n), a = loadAmt(x), ty = x.t === "หมูเป็น" ? "หมูเป็น" : "ซาก";
    // kgn = น้ำหนักเฉพาะรอบที่ใส่จำนวนตัว ไว้คิด "เฉลี่ย กก./ตัว" (รอบที่ไม่ใส่จำนวนตัวไม่เอามานับ จะได้ไม่เพี้ยน)
    t.kg += w; t.n += n; t.kgn += n ? w : 0; t.amt += a; t.lab += labOf(x); t.dd += num(x.dd);
    if (num(x.dd) && x.ddn) t.ddn.push(x.ddn);
    // meat = ค่าเนื้ออย่างเดียว (น้ำหนัก × ราคา) ไว้คิดราคาเฉลี่ย/กก. ไม่ให้ค่าทำ-ลดตำหนิมาปน
    const b = t.by[ty] || (t.by[ty] = { kg: 0, n: 0, kgn: 0, amt: 0, meat: 0 }); b.kg += w; b.n += n; b.kgn += n ? w : 0; b.amt += a; b.meat += w * num(x.p);
  }
  t.kg = r2(t.kg); t.amt = r2(t.amt); t.lab = r2(t.lab); t.dd = r2(t.dd);
  return t;
}
const emptyT = t => !t.kg && !t.n && !t.amt && !t.paid && !t.disc;
function loadsDesc(t, k) {
  const parts = Object.keys(t.by).map(ty => `${k === "sale" ? ty + " " : ""}${t.by[ty].n ? fmtN(t.by[ty].n, 0) + " ตัว " : ""}${kg1(t.by[ty].kg)} กก.`);
  if (t.lab) parts.push(`ค่าทำ ${money(t.lab)}`);
  if (t.dd) parts.push(`ลดตำหนิ${t.ddn.length ? ` (${t.ddn.join(", ")})` : ""} −${money(t.dd)}`);
  return parts.join(" · ");
}
/** ชนิดที่ลูกค้าคนนี้ซื้อครั้งล่าสุดในรอบนี้ (คนซื้อหมูเป็นประจำ จะได้ไม่ต้องกดเปลี่ยนทุกวัน) */
function partyType(id, idx, date) {
  for (let i = S.dates.length - 1; i >= 0; i--) {
    const d = S.dates[i]; if (d >= date) continue;
    const loads = ((lineOf("sale", d, id) || {}).loads) || [], x = loadOfRound(loads, idx + 1) || loads.find(y => !y.skip && num(y.w));
    if (x && num(x.w)) return isLive(x) ? "หมูเป็น" : "ซาก";
  }
  return "ซาก";
}
/** ค่าทำต่อตัวของลูกค้าคนนี้: ใช้ค่าล่าสุดที่เคยคิด (รอบเดียวกันก่อน) แบบเดียวกับราคา */
function partyLab(id, idx, date) {
  for (const same of [true, false]) for (let i = S.dates.length - 1; i >= 0; i--) {
    const d = S.dates[i]; if (d >= date) continue;
    const loads = ((lineOf("sale", d, id) || {}).loads) || [];
    const x = same ? loadOfRound(loads, idx + 1) : loads.find(y => isLive(y) && num(y.lab));
    if (isLive(x) && num(x.lab)) return { lab: num(x.lab), from: d };
  }
  return { lab: 0, from: null };
}
/** ราคาของวัน: ถ้าวันนั้นไม่ได้ตั้ง ใช้ราคาล่าสุดก่อนหน้า ถ้าไม่เคยตั้งเลยใช้ค่าเริ่มต้น */
function priceKey(k, ty) { return k === "buy" ? "buyPrice" : ty === "หมูเป็น" ? "livePrice" : "price"; }
function priceOn(k, date, ty) {
  const pk = priceKey(k, ty), day = S.days[date];
  if (day && day[pk] !== undefined && day[pk] !== null && day[pk] !== "") return num(day[pk]);
  for (let i = S.dates.length - 1; i >= 0; i--) {
    const d = S.dates[i]; if (d >= date) continue;
    const v = S.days[d][pk]; if (v !== undefined && v !== null && v !== "") return num(v);
  }
  return 0; // ยังไม่เคยขายให้คนนี้: ให้พิมพ์ราคาเองครั้งแรก
}
/** ราคาของแต่ละคน: ใช้ราคาล่าสุดที่เคยขายให้คนนี้ (รอบเดียวกัน ชนิดเดียวกันก่อน) ถ้าไม่เคยขาย ใช้ราคาเริ่มต้น */
function partyPrice(k, id, idx, ty, date) {
  const match = x => x && num(x.p) && (k === "buy" || (x.t === "หมูเป็น" ? "หมูเป็น" : "ซาก") === ty);
  // หารอบเดียวกันย้อนไปก่อน (เมื่อวานมีแค่รอบ 1 วันนี้รอบ 3 ก็ยังได้ราคารอบ 3 ครั้งล่าสุด) ไม่เจอค่อยใช้รอบไหนก็ได้
  for (const same of [true, false]) for (let i = S.dates.length - 1; i >= 0; i--) {
    const d = S.dates[i]; if (d >= date) continue;
    const loads = ((lineOf(k, d, id) || {}).loads) || [], x = same ? loadOfRound(loads, idx + 1) : loads.find(match);
    if (match(x)) return { p: num(x.p), from: d };
  }
  return { p: priceOn(k, date, ty), from: null };
}
const roundsOf = (k, p) => k === "sale" ? Math.min(5, Math.max(1, Math.round(num(p && p.rounds)) || 1)) : 1;
// แต่ละรอบจำเลขรอบของตัวเอง (r) วันไหนไม่มีรอบ 2 รอบ 3 ก็ยังเป็นรอบ 3 ราคาไม่สลับกัน ข้อมูลเก่าที่ไม่มี r ใช้ลำดับแทน
const roundNo = (x, i) => Math.max(1, Math.round(num(x && x.r)) || i + 1);
const loadOfRound = (loads, r) => loads.find((x, i) => !x.skip && roundNo(x, i) === r);
// รอบประจำที่วันนั้นพ่อกด ✕ ไว้ (บันทึกเป็น skip) ไม่ต้องโชว์ ส่วนรอบที่แค่ยังไม่ได้กรอก โชว์ให้กรอกต่อได้ทั้งวัน
const skippedRounds = loads => new Set(loads.map((x, i) => x.skip ? roundNo(x, i) : 0).filter(Boolean));
function roundsToShow(loads, R) {
  const skip = skippedRounds(loads), out = new Set();
  for (let r = 1; r <= R; r++) if (!skip.has(r)) out.add(r);
  loads.forEach((x, i) => { if (!x.skip) out.add(roundNo(x, i)); });

function blankLoads(k, id, date, from, to) {
  const out = [];

  return out;
}

const blankLoad = (k, id, date, r, ty) => ({ w: "", n: "", p: "", t: ty, r,
  lab: k === "sale" && ty === "หมูเป็น" ? String(partyLab(id, r - 1, date).lab || "") : "", dd: "", ddn: "" });
function draftFor(k, date, id) {
  const l = lineOf(k, date, id), R = roundsOf(k, partyById(k, id)), has = l && !emptyT(lineTotals(l));
  const raw = (l && l.loads) || [];
  const loads = has ? raw.map((x, i) => ({ w: x.w ? String(x.w) : "", n: x.n ? String(x.n) : "", p: String(x.p ?? ""), t: x.t === "หมูเป็น" ? "หมูเป็น" : "ซาก", r: roundNo(x, i), skip: !!x.skip,
    lab: x.lab ? String(x.lab) : "", dd: x.dd ? String(x.dd) : "", ddn: x.ddn || "", showDd: !!num(x.dd) })).filter(x => !x.skip) : [];
  // รอบประจำที่ยังไม่ได้กรอก เติมช่องว่างให้ (ช่องว่างไม่ถูกบันทึก) ยกเว้นรอบที่กด ✕ ไว้แล้ว
  for (const r of roundsToShow(has ? raw : [], R)) if (!loadOfRound(loads, r)) loads.push(blankLoad(k, id, date, r, k === "sale" ? partyType(id, r - 1, date) : "ซาก"));

    method: (l && l.method) || "โอน", note: (l && l.note) || "", showDisc: !!(has && num(l.disc)) };
}

function draftTotals() {

async function openParty(id, round) {

  if (S.openId !== id || !S.draft) { S.openId = id; S.draft = draftFor(S.entryKind, S.date, id); S.dirty = false; }

  const w = $("#w" + Math.max(0, at)); if (w && (wide() || round)) w.focus();

async function saveLine(skipConfirm) {
  const k = S.entryKind, id = S.openId, date = S.date, p = partyById(k, id); if (!p) return;
  const D = S.draft;
  // ใส่น้ำหนักแต่ไม่มีราคา = ขาย 0 บาท หนี้หายเงียบๆ ไม่ให้ลงจนกว่าจะใส่ราคา
  const noP = D.loads.findIndex(x => num(x.w) && !num(x.p)), noW = D.loads.findIndex(x => num(x.n) && !num(x.w));
  // หมูเป็นที่มีค่าทำ ต้องรู้จำนวนตัว ไม่งั้นค่าทำหายเงียบๆ
  const noN = k === "sale" ? D.loads.findIndex(x => isLive(x) && num(x.w) && num(x.lab) && !num(x.n)) : -1;
  const bad = [[noP, "#p", x => `รอบ ${x.r} ยังไม่มีราคา พิมพ์ราคา หรือเลือก "ราคาเดิม"`], [noW, "#w", x => `รอบ ${x.r} ใส่จำนวนตัวแล้ว แต่ยังไม่ใส่น้ำหนัก`],
    [noN, "#n", x => `หมูเป็นรอบ ${x.r} มีค่าทำ ใส่จำนวนตัวด้วย`]].find(([i]) => i >= 0);
  if (bad) { const [i, f, msg] = bad; toast(msg(D.loads[i])); const el = $(f + i); if (el) el.focus(); return; }
  const line = {
    loads: D.loads.filter(x => num(x.w) || num(x.n)).map(x => ({ w: r2(num(x.w)), n: num(x.n), p: r2(num(x.p)), t: k === "sale" ? x.t : "ซาก", r: x.r,
      ...(k === "sale" && isLive(x) && num(x.lab) ? { lab: r2(num(x.lab)) } : {}),
      ...(k === "sale" && num(x.dd) ? { dd: r2(num(x.dd)), ddn: String(x.ddn || "").trim() } : {}) })),
    paid: r2(num(D.paid)), disc: r2(num(D.disc)), method: D.method || "เงินสด", note: String(D.note || "").trim(),
  };
  // รอบประจำที่พ่อกด ✕ ออก จดไว้ว่า "วันนี้ไม่มีรอบนี้" จะได้ไม่โผล่กลับมา
  if (line.loads.length) for (let r = 1; r <= roundsOf(k, p); r++) if (!D.loads.some(x => x.r === r)) line.loads.push({ w: 0, n: 0, p: 0, t: "ซาก", r, skip: true });
  line.loads.sort((a, b) => a.r - b.r);
  // วันนั้นมีรับเงินที่เลือกวันไว้ เก็บไว้เหมือนเดิม
  const pl = lineOf(k, date, id);
  if (pl && (line.paid || line.disc)) setAlloc(line, allocGroups(pl, line.paid + line.disc));
  // กันเผลอแก้ตัวเลขของวันก่อนๆ: ถ้ายอดเปลี่ยน ให้ดูก่อน→หลัง แล้วกดยืนยันเอง
  // ฝั่งขาย ดูเฉพาะยอดขาย (วันที่มีแค่รับเงิน แล้วมาลงขายเพิ่ม ไม่ต้องถาม)
  const old = lineOf(k, date, id), oldT = old && lineTotals(old);
  if (!skipConfirm && date < todayISO() && old && (k === "sale" ? oldT.amt || oldT.kg || oldT.n : !emptyT(oldT))) {
    const a = lineTotals(old), c = lineTotals(line), ch = [];
    const diff = (lbl, x, y, fm) => { if (Math.abs(x - y) > 0.004) ch.push(`${lbl}  ${fm(x)} → ${fm(y)}`); };
    diff("ตัว", a.n, c.n, v => fmtN(v, 0)); diff("กก.", a.kg, c.kg, kg1); diff(K[k].amountLabel, a.amt, c.amt, money);
    diff(K[k].payLabel, a.paid, c.paid, money); diff("ลดให้", a.disc, c.disc, money);
    if (ch.length) {
      const inCut = k === "sale" && periodList(id).some(pp => (!pp.from || date >= pp.from) && date <= pp.to);
      const msg = `แก้รายการเก่า: ${p.name} วันที่ ${thShort(date)}\n\n${ch.join("\n")}`
        + (inCut ? "\n\nวันนี้อยู่ในงวดที่ปิดแล้ว ยอดงวดจะเปลี่ยน ถ้าส่งบิลไปแล้วต้องส่งใหม่" : "") + "\n\nยืนยันแก้ไหม?";
      if (!(await askConfirm(msg, "ยืนยันแก้"))) return;
    }
  }
  const day = S.days[date] || (S.days[date] = { date, lines: {}, buys: {} });
  day[K[k].key] = Object.assign({}, day[K[k].key], { [id]: line });
  S.dates = Object.keys(S.days).sort(); S.dirty = false;
  // เก็บลงกล่องรอส่งทันที ก่อนทำอย่างอื่น ถ้าเน็ตหลุด รายการยังอยู่ในเครื่อง ส่งให้เองทีหลัง
  const key = queueLine(k, date, id, line, p.name);
  fillEntryList();
  await closePanel(true); // ลงแล้วกลับไปหน้ารายชื่อ (ลำดับลูกค้าแต่ละวันไม่แน่นอน)
  await flushOutbox();
  const left = S.outbox.find(x => x.key === key);
  if (!left) toast(`ลงบัญชี ${p.name} แล้ว`);
  else if (left.err) toast(`ลงบัญชี ${p.name} ไม่สำเร็จ: ${left.err}`);
  else if (!S.needPin) toast(`เน็ตไม่ดี เก็บรายการ ${p.name} ไว้ในเครื่องแล้ว จะส่งให้เองตอนเน็ตกลับมา`);
  checkNewDay();
}
async function changeDate(d) {
  if (d === S.date) return;
  if (S.dirty && !(await askConfirm("ยังไม่ได้ลงบัญชีรายการนี้ จะเปลี่ยนวันเลยไหม?", "เปลี่ยนวัน"))) { $("#dateInput").value = S.date; return; }
  S.date = d; S.dirty = false;
  if (S.entryKind === "expense") { S.expDraft = null; fillDateBar(); renderExpenses(); return; }
  if (S.openId) S.draft = draftFor(S.entryKind, d, S.openId);
  fillEntryList(); renderPanel();
}

async function saveExpense() {
  const E = S.expDraft, amt = r2(num(E.amount));
  if (!amt) { E.err = "ใส่จำนวนเงินก่อนลงบัญชี"; renderExpenses(); $("#eAmt").focus(); return; }
  const e = { id: E.id || uid("e"), date: S.date, cat: E.cat, desc: String(E.desc || "").trim(), amount: amt, method: E.method };
  const i = S.expenses.findIndex(x => x.id === e.id);
  if (i >= 0) S.expenses[i] = e; else S.expenses.push(e);
  S.expDraft = null; renderExpenses();
  try { await backend.saveExpense(e); toast(`ลงรายจ่าย ${e.cat} ${money(amt)} แล้ว`); }
  catch (err) { toast("ลงรายจ่ายไม่สำเร็จ ลองอีกครั้ง"); loadAll(true); }
}

/** วันที่รับเงินครั้งล่าสุดของลูกค้าคนนี้ (ไม่นับวันก่อนเริ่มนับหนี้) */
function lastPay(id) {
  for (let i = S.dates.length - 1; i >= 0; i--) {
    const d = S.dates[i]; if (!inBooks(d)) break;
    const l = lineOf("sale", d, id); if (l && num(l.paid)) return { d, amt: num(l.paid) };
  }
  return null;
}

/* ---------- หน้าต่างรับเงิน: แตะวันที่ลูกค้าจ่าย ช่อง "รับ" เติมเต็มยอดวันนั้นให้ แก้เป็นยอดโอนจริงได้ + ลดให้รายวัน ----------
   เก็บเป็นเงินรับ (paid) + ลดให้ (disc) ในรายการของลูกค้าคนนั้นวันที่เงินเข้า รวมกับยอดขายวันนั้น (ถ้ามี)
   เงินของแต่ละวันที่เลือกเก็บเป็นก้อน (allocBy) · เงินที่ไม่ได้เลือกวัน ตัดยอดเก่าสุดก่อน */
function payLineOf(id, date) {
  const l = lineOf("sale", date, id);
  return l ? clone(l) : { loads: [], paid: 0, disc: 0, method: "โอน", note: "" };
}
// รายการเดิมที่เอาเงินรับออก (ยอดขายวันนั้นยังอยู่)
const withoutPay = l => setAlloc(Object.assign(l, { paid: 0, disc: 0 }), []);
// ลองใส่รายการสมมุติลงไปชั่วคราว (ได้หลายวัน) แล้วคิดยอดค้างด้วยสูตรเดิม (FIFO / งวด) จะได้ตรงกับหน้าอื่นเสมอ
function obWith(id, lines) {
  const keep = {}, dates = S.dates;
  for (const d in lines) {
    keep[d] = S.days[d]; const day = S.days[d] || { date: d, lines: {}, buys: {} };
    S.days[d] = Object.assign({}, day, { lines: Object.assign({}, day.lines || {}, { [id]: lines[d] }) });
  }
  S.dates = Object.keys(S.days).sort();
  try { return openBills("sale", id, "9999-12-31"); }
  finally { for (const d in keep) { if (keep[d]) S.days[d] = keep[d]; else delete S.days[d]; } S.dates = dates; }
}
// ยอดค้างตอนก่อนรับเงินก้อนนี้: เอาเงินรับตั้งแต่วันนั้นเป็นต้นไปออก (ตัดยอดไล่ตามวันที่รับ เงินก้อนหลังๆ ยังไม่เกิด)
// วันที่เงินก้อนหลังมาตัดไปแล้วยังอยู่ในรายการ วันที่เคยเลือกไว้จะไม่หายตอนเปิดแก้
function obBefore(id, date) {
  const lines = {};
  for (const d of S.dates) { if (d < date) continue; const l = lineOf("sale", d, id); if (l && (num(l.paid) || num(l.disc))) lines[d] = withoutPay(clone(l)); }
  return obWith(id, lines);
}
// sel = ยอดที่แตะมาจากหน้าบัญชีลูกค้า → เปิดมาพร้อมเลือกไว้แล้ว · edit = แก้เงินที่รับไว้แล้วของวันนั้น
function openPay(id, date, edit, sel) {
  const p = partyById("sale", id); if (!p) return;
  const d = date || todayISO(), old = payLineOf(id, d);
  edit = !!edit && !!(num(old.paid) || num(old.disc));
  const P = S.pay = { id, date: d, from: edit ? d : null, edit, method: (num(old.paid) && METHODS.includes(old.method) && old.method) || "โอน", note: edit ? old.note || "" : "", showNote: !!(edit && old.note),
    picks: {}, extra: 0, exDisc: 0, fixed: false, snap: null, oldPaid: num(old.paid), oldDisc: num(old.disc) };
  P.base = edit ? obBefore(id, d) : openBills("sale", id, "9999-12-31");
  // แก้ยอดเดิม: ยอดเงินคงที่ไว้ก่อน เอาออกจากวันหนึ่งแล้วแตะอีกวัน = ย้ายเงินไปวันนั้น
  if (edit) { fillPicks(P, old); P.fixed = true; } else (sel || []).forEach(k => togglePick(P, k));
  renderPay();
}
// แก้ยอดเดิม: แตกก้อนที่เลือกวันไว้กลับเป็นช่องรับ/ลดของแต่ละวัน · ที่เหลือ = เงินที่ไม่ได้เลือกวัน
function fillPicks(P, old) {
  const used = {}; let gr = 0, gd = 0;
  for (const g of allocGroups(old)) {
    let rem = g.a, remD = g.d;
    for (const b of P.base.bills) {
      if (rem <= 0.004) break;
      const key = billId(b), room = r2(b.left - (used[key] || 0));
      if (room <= 0.004 || !b.keys.some(k => g.k.includes(k))) continue;
      const t = Math.min(rem, room), td = Math.min(remD, t), pk = P.picks[key] || (P.picks[key] = { r: 0, dc: 0 });
      pk.r = r2(pk.r + t - td); pk.dc = r2(pk.dc + td); used[key] = (used[key] || 0) + t;
      rem -= t; remD -= td; gr += t - td; gd += td;
    }
  }
  P.extra = r2(Math.max(0, num(old.paid) - gr)); P.exDisc = r2(Math.max(0, num(old.disc) - gd));
}
// แตะวัน: เติมเต็มยอดที่เหลือของวันนั้น · ถ้ายอดโอนคงที่แล้ว (พิมพ์เอง/กำลังแก้) เอาจากเงินที่ยังไม่ได้ลงวันไหนมาใส่ ยอดโอนไม่เปลี่ยน
// เงินหมดแล้ว = ช่องรับ 0 ให้พ่อแก้เอง (ไม่แอบเพิ่มยอดโอน)
function togglePick(P, key) {
  const b = P.base.bills.find(x => billId(x) === key); if (!b) return;
  P.snap = null;
  if (P.picks[key]) { if (P.fixed) P.extra = r2(P.extra + P.picks[key].r); delete P.picks[key]; return; }
  let r = b.left;
  if (P.fixed) { r = Math.min(b.left, P.extra); P.extra = r2(P.extra - r); }
  P.picks[key] = { r: r2(r), dc: 0 };
}
/**
 * พิมพ์ยอดโอน: คิดจากยอดตอนเริ่มพิมพ์ (snap) จะได้ไม่เพี้ยนระหว่างกดทีละตัวเลข
 * เพิ่มขึ้น → เติมวันที่เลือกที่ยังไม่เต็ม (เก่าไปใหม่) ที่เหลือ = ตัดเก่าสุดก่อน
 * ลดลง → ลดวันที่เลือกจากใหม่ไปเก่า แล้วค่อยลดเงินที่ไม่ได้เลือกวัน (เงินที่ไม่ได้เลือกวันของเดิมคงไว้ก่อน)
 */
function setTotal(P, T) {
  const bills = P.base.bills.filter(b => P.picks[billId(b)]);
  if (!P.snap) P.snap = { r: Object.fromEntries(bills.map(b => [billId(b), P.picks[billId(b)].r])), extra: P.extra };
  bills.forEach(b => { P.picks[billId(b)].r = P.snap.r[billId(b)] || 0; }); P.extra = P.snap.extra;
  T = r2(Math.max(0, T));
  let d = r2(T - P.extra - bills.reduce((s, b) => s + P.picks[billId(b)].r, 0));
  if (d > 0) {

/* ---------- จัดลำดับรายชื่อ: จับที่ขีด ≡ แล้วลากขึ้นลง กด "เสร็จ" ถึงบันทึก ---------- */
function openReorder(pk) {
  const list = partiesOf(pk), m = $("#modal");
  m.innerHTML = `<div class="modal-card reorder" role="dialog" aria-modal="true" aria-label="จัดลำดับ">
    <p><b>จัดลำดับ${pk === "sale" ? "ลูกค้า" : "ฟาร์ม"}</b><br><span class="pencil small">จับที่ ≡ ทางขวา แล้วลากขึ้นลง · ลำดับนี้ใช้ในหน้าบันทึก</span></p>
    <ul class="rolist" id="roList" data-pk="${pk}">${list.map((p, i) => `<li data-id="${esc(p.id)}"><span class="no">${i + 1}</span><span class="nm">${esc(p.name)}</span><span class="grip" aria-hidden="true">≡</span></li>`).join("")}</ul>
    <div class="row"><button class="btn" data-act="reorderCancel">ยกเลิก</button><button class="btn solid" data-act="reorderDone">เสร็จ</button></div></div>`;
  m.hidden = false; bindReorder($("#roList"));
}
function bindReorder(ul) {
  let dr = null;
  const renumber = () => [...ul.children].forEach((li, i) => { li.querySelector(".no").textContent = i + 1; });
  const place = y => {
    // ลากเลยครึ่งแถว = สลับกับแถวข้างๆ (แถวสูงเท่ากันทุกแถว)
    let dy = y - dr.y;
    while (dy > dr.h / 2 && dr.li.nextElementSibling) { ul.insertBefore(dr.li.nextElementSibling, dr.li); dr.y += dr.h; dy -= dr.h; }
    while (dy < -dr.h / 2 && dr.li.previousElementSibling) { ul.insertBefore(dr.li, dr.li.previousElementSibling); dr.y -= dr.h; dy += dr.h; }
    dr.li.style.transform = `translateY(${dy}px)`;
  };
  ul.addEventListener("pointerdown", e => {
    const g = e.target.closest(".grip"); if (!g) return;
    e.preventDefault(); const li = g.closest("li");
    try { li.setPointerCapture(e.pointerId); } catch (err) { /* old browser */ }
    dr = { li, pid: e.pointerId, y: e.clientY, h: li.getBoundingClientRect().height, lastY: e.clientY };
    li.classList.add("dragging");
  });
  ul.addEventListener("pointermove", e => {
    if (!dr || e.pointerId !== dr.pid) return;
    e.preventDefault(); dr.lastY = e.clientY;
    // ลากไปชิดขอบบน/ล่าง = เลื่อนรายชื่อให้เอง
    const r = ul.getBoundingClientRect(), step = e.clientY < r.top + 40 ? -12 : e.clientY > r.bottom - 40 ? 12 : 0;
    if (step) { const s0 = ul.scrollTop; ul.scrollTop += step; dr.y -= ul.scrollTop - s0; }
    place(e.clientY);
  });
  const end = e => { if (!dr || e.pointerId !== dr.pid) return; dr.li.style.transform = ""; dr.li.classList.remove("dragging"); dr = null; renumber(); };
  ul.addEventListener("pointerup", end); ul.addEventListener("pointercancel", end);
}
/* ---------- หน้าบันทึก: กดค้างที่ชื่อครึ่งวินาที (เครื่องสั่นเบาๆ) แล้วลากขึ้นลง = ย้ายลำดับ ปล่อยนิ้วแล้วบันทึกเอง ----------
   ต้องกดค้างก่อนถึงจะลากได้ ถ้าปัดนิ้วเลย = เลื่อนรายชื่อตามปกติ ไม่ย้ายชื่อโดยไม่ตั้งใจ */
let ld = null, ldNoClick = 0, ldTouchAt = 0;
const LD_HOLD = 500;
function scrollerOf(el) {
  for (let p = el.parentElement; p && p !== document.body; p = p.parentElement) {
    const o = getComputedStyle(p).overflowY;
    if ((o === "auto" || o === "scroll") && p.scrollHeight > p.clientHeight + 1) return p;
  }
  return document.scrollingElement || document.documentElement;
}
// แถวหลัก + แถวรอบย่อย (รอบ 1, 2, 3) ของคนเดียวกัน ย้ายไปด้วยกัน
function groupRows(tr) {
  const id = tr.dataset.id, rows = []; let a = tr;
  while (a.previousElementSibling && a.previousElementSibling.dataset.id === id) a = a.previousElementSibling;
  for (let x = a; x && x.dataset.id === id; x = x.nextElementSibling) rows.push(x);
  return rows;
}
const rowsH = rows => rows.reduce((s, r) => s + r.getBoundingClientRect().height, 0);
const mainIds = () => $$("#plist tbody tr.tap:not(.subrow)").map(r => r.dataset.id);
function ldStart(tr, x, y) {
  ldEnd();
  if (S.entryKind === "expense") return;
  ld = { tr, x0: x, y0: y, y, active: false, timer: setTimeout(ldActivate, LD_HOLD) };
}
function ldActivate() {
  if (!ld || !ld.tr.isConnected) { ld = null; return; }
  ld.active = true; ld.rows = groupRows(ld.tr); ld.base = ld.y; ld.order0 = mainIds().join(); ld.sc = scrollerOf($("#plist"));
  ld.rows.forEach(r => r.classList.add("dragging"));
  try { if (navigator.vibrate) navigator.vibrate(25); } catch (e) { /* no vibration */ }
  ld.raf = requestAnimationFrame(ldAuto);
}
// ลากเลยครึ่งของคนข้างๆ = สลับที่กัน (แต่ละคนสูงไม่เท่ากัน เพราะบางคนมีหลายรอบ)
function ldPlace() {
  const rows = ld.rows, tb = rows[0].parentNode; let dy = ld.y - ld.base;
  for (let nx; (nx = rows[rows.length - 1].nextElementSibling) && nx.dataset.id;) {
    const g = groupRows(nx), h = rowsH(g); if (dy <= h / 2) break;
    g.forEach(r => tb.insertBefore(r, rows[0])); ld.base += h; dy -= h;
  }
  for (let pv; (pv = rows[0].previousElementSibling) && pv.dataset.id;) {
    const g = groupRows(pv), h = rowsH(g); if (dy >= -h / 2) break;
    rows.forEach(r => tb.insertBefore(r, g[0])); ld.base -= h; dy += h;
  }
  rows.forEach(r => r.style.setProperty("--dy", dy + "px"));
}
// ลากไปชิดขอบบน/ล่างจอ = เลื่อนรายชื่อให้เอง
function ldAuto() {
  if (!ld || !ld.active) return;
  const sc = ld.sc, isDoc = sc === document.scrollingElement || sc === document.documentElement, vh = window.innerHeight;
  const r = isDoc ? { top: 0, bottom: vh } : sc.getBoundingClientRect(), top = Math.max(r.top, 0);
  // แถบแท็บล่างจอ (มือถือ) นับเป็นขอบล่าง · เลื่อนเองเฉพาะหลังขยับนิ้วแล้ว (กดค้างชื่อแถวล่างๆ จอจะได้ไม่วิ่งเอง)
  const tabs = $("#tabs").getBoundingClientRect(), bot = Math.min(r.bottom, vh, tabs.top > vh / 2 ? tabs.top : vh);
  const moved = Math.abs(ld.y - ld.y0) > 12;
  const step = !moved ? 0 : ld.y < top + 60 && ld.y < ld.y0 ? -10 : ld.y > bot - 60 && ld.y > ld.y0 ? 10 : 0;
  if (step) { const s0 = sc.scrollTop; sc.scrollTop += step; const ds = sc.scrollTop - s0; if (ds) { ld.base -= ds; ldPlace(); } }
  ld.raf = requestAnimationFrame(ldAuto);
}
function ldMove(x, y, ev) {
  if (!ld) return;
  if (!ld.active) { if (Math.abs(x - ld.x0) > 8 || Math.abs(y - ld.y0) > 8) { clearTimeout(ld.timer); ld = null; } return; }
  if (ev.cancelable) ev.preventDefault();
  ld.y = y; ldPlace();
}
function ldEnd() {
  if (!ld) return;
  const was = ld; ld = null; clearTimeout(was.timer); cancelAnimationFrame(was.raf);
  if (!was.active) return;
  ldNoClick = Date.now();
  was.rows.forEach(r => { r.classList.remove("dragging"); r.style.removeProperty("--dy"); });
  const ids = mainIds();
  if (ids.join() === was.order0) { if (S.listStale) fillEntryList(); return; }
  // เรียงใหม่เฉพาะคนที่เห็นในหน้านี้ คนที่ปิดใช้งาน (ซ่อนอยู่) อยู่ตำแหน่งเดิม
  const list = partiesOf(S.entryKind), seen = new Set(ids), byId = new Map(list.map(p => [p.id, p])); let j = 0;
  const next = list.map(p => seen.has(p.id) ? byId.get(ids[j++]) : p);
  list.splice(0, list.length, ...next);
  fillEntryList(); saveConfigToast("ย้ายลำดับแล้ว");
}
function bindListDrag(box) {
  const rowAt = t => t && t.closest && t.closest("tbody tr.tap");
  box.addEventListener("touchstart", e => { ldTouchAt = Date.now(); const tr = rowAt(e.target); if (!tr || e.touches.length > 1) { ldEnd(); return; } ldStart(tr, e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
  box.addEventListener("touchmove", e => { if (ld) ldMove(e.touches[0].clientX, e.touches[0].clientY, e); }, { passive: false });
  box.addEventListener("touchend", () => { ldTouchAt = Date.now(); ldEnd(); });
  box.addEventListener("touchcancel", ldEnd);
  box.addEventListener("mousedown", e => { if (e.button !== 0 || Date.now() - ldTouchAt < 800) return; const tr = rowAt(e.target); if (tr) ldStart(tr, e.clientX, e.clientY); });
  box.addEventListener("contextmenu", e => { if (rowAt(e.target)) e.preventDefault(); });
}
document.addEventListener("mousemove", e => { if (ld && Date.now() - ldTouchAt > 800) ldMove(e.clientX, e.clientY, e); });
document.addEventListener("mouseup", () => { if (Date.now() - ldTouchAt > 800) ldEnd(); });

function saveConfigToast(ok) { backend.saveConfig().then(() => toast(ok)).catch(() => { toast("บันทึกการตั้งค่าไม่สำเร็จ"); loadAll(true); }); }

/* ================= toast, confirm, copy ================= */
let toastT;
// act = { label, fn } ปุ่มเล็กในข้อความ (เช่น "แก้" หลังรับเงิน) ค้างไว้นานขึ้นให้ทันกด
function toast(msg, act) {
  const t = $("#toast"); t.textContent = msg; t.classList.toggle("act", !!act);
  if (act) { const b = document.createElement("button"); b.type = "button"; b.className = "tbtn"; b.textContent = act.label; b.onclick = () => { t.classList.remove("show"); act.fn(); }; t.append(b); }
  t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), act ? 5000 : 2600);
}

  return new Promise(res => {

}
async function copyFrom(ta, okMsg) {

  catch (err) { try { if (document.execCommand("copy")) { toast(okMsg); return; } } catch (e2) { /* ignore */ } toast("กดค้างที่ข้อความเพื่อคัดลอก"); }
}

/* ================= events ================= */
async function leaveEntryOk() { return !(S.tab === "entry" && S.dirty) || await closePanel(); }

  const act = b.dataset.act;

      setPin(""); lsSet(LS_CACHE, null); S.cachedAt = null; S.pin = ""; S.pinMsg = ""; S.needPin = true; S.loaded = false; render(); break;
    case "prevDay": changeDate(addDays(S.date, -1)); break;

    case "ltype": {
      const i = +b.dataset.i, x = S.draft.loads[i], ty = b.dataset.t; if (x.t === ty) return;
      x.t = ty; x.p = ""; // เปลี่ยนชนิด ราคาคนละตัว ล้างไว้ให้ติ๊กหรือพิมพ์ใหม่
      if (ty === "หมูเป็น" && !num(x.lab)) x.lab = String(partyLab(S.openId, x.r - 1, S.date).lab || "");
      S.dirty = true; renderPanel(); break;
    }
    case "pkeep": {
      const i = +b.dataset.i, x = S.draft.loads[i], f = $("#p" + i);
      x.p = b.checked ? String(partyPrice(S.entryKind, S.openId, x.r - 1, x.t, S.date).p || "") : "";
      f.value = x.p; S.dirty = true; updatePanelCalc();
      if (!b.checked) f.focus();
      break;
    }
    case "ddShow": { const x = S.draft.loads[+b.dataset.i]; x.showDd = true; renderPanel(); const f = $("#dd" + b.dataset.i); if (f) f.focus(); break; }
    case "ddClear": { const x = S.draft.loads[+b.dataset.i]; x.showDd = false; x.dd = ""; x.ddn = ""; S.dirty = true; renderPanel(); break; }
    case "addload": {
      // เอารอบที่ลบไปกลับมาก่อน (เช่น ลบรอบ 2 ไป กดเพิ่มได้รอบ 2 คืน) ไม่งั้นต่อท้าย
      const L = S.draft.loads, last = L[L.length - 1], ty = last ? last.t : "ซาก";
      let r = 1; while (L.some(x => x.r === r)) r++;
      const nl = blankLoad(S.entryKind, S.openId, S.date, r, ty);
      L.push(nl); L.sort((a, b) => a.r - b.r); S.dirty = true;
      renderPanel(); const w = $("#w" + L.indexOf(nl)); if (w) w.focus(); break;
    }
    case "rmload": {
      const x = S.draft.loads[+b.dataset.i];
      if ((num(x.w) || num(x.n)) && !(await askConfirm(`ลบรอบ ${x.r} (${num(x.w) ? kg1(num(x.w)) + " กก." : num(x.n) + " ตัว"}) ออก?`, "ลบรอบนี้"))) return;
      S.draft.loads.splice(+b.dataset.i, 1); S.dirty = true; renderPanel(); break;
    }
    case "method": S.draft.method = b.dataset.m; S.dirty = true; $$('[data-act="method"]').forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === S.draft.method))); break;
    case "payAll": { const t = draftTotals(); S.draft.paid = String(Math.max(0, r2(balBefore(S.entryKind, S.openId, S.date) + t.amt - t.disc))); $("#pPaid").value = S.draft.paid; S.dirty = true; updatePanelCalc(); break; }
    case "roundOff": {
      const t = draftTotals(), remain = r2(balBefore(S.entryKind, S.openId, S.date) + t.amt - t.paid);
      if (remain <= 0) return;
      S.draft.disc = String(remain); S.draft.showDisc = true; $("#pDisc").value = S.draft.disc; S.dirty = true; updatePanelCalc(); toast(`ลดให้ ${money(remain)} ปิดยอดแล้ว กดลงบัญชีเพื่อบันทึก`); break;
    }
    case "showDisc": S.draft.showDisc = true; updatePanelCalc(); $("#pDisc").focus(); break;
    case "clearDisc": S.draft.disc = ""; S.draft.showDisc = false; $("#pDisc").value = ""; S.dirty = true; updatePanelCalc(); break;
    case "clear": {
      const sale = S.entryKind === "sale";
      if (!(await askConfirm(`ล้าง${sale ? "ยอดขาย" : "รายการ"}ของคนนี้ใน${dayWord(S.date)}ทั้งหมด?${sale && num(S.draft.paid) ? `\n(เงินที่รับวันนี้ ${money(num(S.draft.paid))} ยังอยู่)` : ""}`, "ล้าง"))) return;
      // ฝั่งขาย: ล้างแค่ยอดขาย เงินที่รับในวันเดียวกัน (ลงจากแท็บรับเงิน) ยังอยู่
      const D = S.draft;
      S.draft = { loads: blankLoads(S.entryKind, S.openId, S.date, 0, roundsOf(S.entryKind, partyById(S.entryKind, S.openId))),
        paid: sale ? D.paid : "", disc: sale ? D.disc : "", method: D.method, note: sale && num(D.paid) ? D.note : "", showDisc: false };
      await saveLine(true); break;
    }
    case "save": saveLine(false); break;
    case "noteShow": S.draft.showNote = true; renderPanel(); { const f = $("#pNote"); if (f) f.focus(); } break;
    case "emethod": S.expDraft.method = b.dataset.m; $$('[data-act="emethod"]').forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === S.expDraft.method))); break;
    case "expSave": saveExpense(); break;
    case "expCancel": S.expDraft = null; renderExpenses(); break;
    case "expEdit": { const x = S.expenses.find(y => y.id === b.dataset.id); if (!x) return; S.expDraft = { id: x.id, cat: x.cat, desc: x.desc || "", amount: String(x.amount), method: x.method || "เงินสด", err: "" }; renderExpenses(); window.scrollTo(0, 0); break; }
    case "expDelete": {
      const id = S.expDraft && S.expDraft.id; if (!id || !(await askConfirm("ลบรายจ่ายนี้?", "ลบ"))) return;
      S.expenses = S.expenses.filter(x => x.id !== id); S.expDraft = null; renderExpenses();
      backend.saveExpense({ id, deleted: true }).then(() => toast("ลบรายจ่ายแล้ว")).catch(() => { toast("ลบไม่สำเร็จ"); loadAll(true); }); break;
    }
    case "dfilter": S.debtFilter = b.dataset.f; renderDebts(); break;
    case "payOpen": openPay(b.dataset.id, b.dataset.date, b.dataset.edit === "1", b.dataset.pick ? [b.dataset.pick] : null); break;
    case "payPick": togglePick(S.pay, b.dataset.key); renderPay(); break;
    // ช่องลดให้ของวันนั้น ซ่อนไว้จนกว่าจะกด (ไม่ต้องเห็น 0 ทุกวัน)
    case "payDc": { const pk = S.pay.picks[b.dataset.key]; if (!pk) break; pk.showDc = true; renderPay(); const f = document.getElementById("pdc-" + b.dataset.key); if (f) f.focus(); break; }
    case "payDay": S.pay.date = b.dataset.d; renderPay(); break;
    case "payMethod": S.pay.method = b.dataset.m; renderPay(); break;
    case "payEdit": openPay(S.pay.id, S.pay.date, true); break;
    case "payCancel": closePay(); break;
    case "paySave": savePay(false); break;
    case "payDelete": savePay(true); break;
    case "payNoteShow": { const P = S.pay; if (!P.edit) P.note = payLineOf(P.id, P.date).note || ""; P.showNote = true; renderPay(); $("#payNote").focus(); break; }
    // ลดเศษของวันนั้น (เหลือไม่เกินที่ตั้งไว้) · ลดให้ปิดยอดทั้งคน (ตอนไม่ได้เลือกวัน) · พ่อต้องกดเองทุกครั้ง
    case "payRo": {
      const P = S.pay, key = b.dataset.key, pk = P.picks[key], ob = obWith(P.id, payLines(P)), a = ob.bills.find(x => billId(x) === key);
      if (pk && a) { pk.dc = r2(pk.dc + a.left); renderPay(); } break;
    }
    case "payExDisc": { const P = S.pay, ob = obWith(P.id, payLines(P)); if (ob.count) { P.exDisc = r2(P.exDisc + ob.total); updatePay(); } break; }
    case "payExDiscClear": S.pay.exDisc = 0; updatePay(); break;
    case "detail": openDetail(b.dataset.kind || "sale", b.dataset.id); break;
    case "closeDetail": closeDetail(); break;
    case "cutOpen": openCut(b.dataset.id); break;
    case "cutCancel": $("#modal").hidden = true; $("#modal").innerHTML = ""; break;
    case "cutConfirm": confirmCut(b.dataset.id); break;
    case "cutUndo": undoCut(b.dataset.id); break;
    case "periodBill": case "bill": {
      // เปิดหน้าบิล: แตะงวด = เลือกงวดนั้น · ปุ่มส่งบิล = เลือกทุกงวดที่ยังค้าง
      const { k, id } = S.detail;
      if (act === "periodBill") S.billSel = [+b.dataset.i];
      else if (isPeriodCust(k, id)) { const all = periodBills(id, "9999-12-31").all, open = all.map((x, i) => x.left > 0.004 ? i : -1).filter(i => i >= 0); S.billSel = open.length ? open : [all.length - 1]; }
      S.billOpen = true; const box = $("#billBox"); box.innerHTML = billBoxHTML(k, id); box.hidden = false; box.scrollIntoView({ block: "nearest" }); break;
    }
    case "billPick": {
      const i = +b.dataset.i, sel = new Set(S.billSel || []); if (b.checked) sel.add(i); else sel.delete(i);
      S.billSel = [...sel].sort((x, y) => x - y); const box = $("#billBox"), y0 = $("#drawer").scrollTop; box.innerHTML = billBoxHTML(S.detail.k, S.detail.id); $("#drawer").scrollTop = y0; break;
    }
    case "billClose": S.billOpen = false; $("#billBox").hidden = true; $("#billBox").innerHTML = ""; break;
    case "billImg": {
      b.disabled = true; const old = b.textContent; b.textContent = "กำลังทำ…";
      try {
        const m = curBillModel(), cv = await billCanvas(m), png = await canvasBlob(cv, "image/png");
        showBillFiles([{ blob: png, name: `บิล-${m.file}.png` }], "รูปบิล");
      } catch (e) { toast("ทำไฟล์ไม่สำเร็จ ลองอีกครั้ง"); }
      finally { b.disabled = false; b.textContent = old; }
      break;
    }
    case "dayImg": {
      // รูปทำจากยอดที่ลงบัญชีแล้วเท่านั้น ถ้ายังกรอกค้างอยู่ให้ถามก่อน
      if (S.dirty && !(await askConfirm("ยังมีรายการที่กรอกค้างอยู่ ยังไม่ได้ลงบัญชี รูปจะไม่มีรายการนี้ ทำรูปเลยไหม?", "ทำรูปเลย"))) return;
      b.disabled = true; const old = b.textContent; b.textContent = "กำลังทำรูป…";
      try {
        const pages = await dayPages(dayModel(S.date)), blobs = await Promise.all(pages.map(c => canvasBlob(c, "image/png")));
        showBillFiles(blobs.map((blob, i) => ({ blob, name: `บัญชี-${S.date}${blobs.length > 1 ? "-" + (i + 1) : ""}.png` })), `รูปบัญชี${dayWord(S.date)}`);
      } catch (e) { toast("ทำรูปไม่สำเร็จ ลองอีกครั้ง"); }
      finally { b.disabled = false; b.textContent = old; }
      break;
    }
    case "stMode": S.stMode = b.dataset.m; S.billOpen = false; renderDetail(); break;
    case "stPrev": case "stNext": {
      const dir = act === "stPrev" ? -1 : 1;
      if (S.stMode === "week") S.stAnchor = addDays(S.stAnchor, 7 * dir); else { const d = parseISO(S.stAnchor); S.stAnchor = iso(new Date(d.getFullYear(), d.getMonth() + dir, 1)); }
      S.billOpen = false; renderDetail(); break;
    }
    case "gotoEntry": {
      if (!(await leaveEntryOk())) return;
      const k = b.dataset.kind, id = b.dataset.id, d = b.dataset.date || todayISO();
      closeDetail(); S.tab = "entry"; S.entryKind = k; S.date = d; S.openId = null; S.dirty = false; render(); openParty(id); break;
    }
    case "skind": S.sumKind = b.dataset.k; render(); break;
    case "sumMode": S.sumMode = b.dataset.m; render(); break;
    case "sumPrev": case "sumNext": {
      const dir = act === "sumPrev" ? -1 : 1;
      if (S.sumMode === "week") S.sumAnchor = addDays(S.sumAnchor, 7 * dir); else { const d = parseISO(S.sumAnchor); S.sumAnchor = iso(new Date(d.getFullYear(), d.getMonth() + dir, 1)); }
      render(); break;
    }
    case "sumNow": S.sumAnchor = todayISO(); render(); break;
    case "gotoWeek": S.sumMode = "week"; S.sumAnchor = b.dataset.d; render(); break;
    case "orderView": S.orderView = b.dataset.v; render(); break;
    case "reorderOpen": openReorder(b.dataset.pk); break;
    case "reorderCancel": $("#modal").hidden = true; $("#modal").innerHTML = ""; break;
    case "reorderDone": {
      const ul = $("#roList"), pk = ul.dataset.pk, list = partiesOf(pk), ids = [...ul.children].map(li => li.dataset.id);
      $("#modal").hidden = true; $("#modal").innerHTML = "";
      if (ids.join() === list.map(p => p.id).join()) break; // ไม่ได้ย้ายอะไร
      const byId = new Map(list.map(p => [p.id, p]));
      list.splice(0, list.length, ...ids.map(id => byId.get(id)).filter(Boolean));
      render(); saveConfigToast("บันทึกลำดับแล้ว"); break;
    }
    case "logOpen": openLog(200); break;
    case "logMore": openLog(1000); break;
    case "logOnly": S.log.only = b.dataset.v === "1"; renderLog(); break;
    case "gotoDay": S.tab = "entry"; S.entryKind = "sale"; S.date = b.dataset.d; S.openId = null; S.draft = null; S.dirty = false; render(); window.scrollTo(0, 0); break;
    case "copyReport": { $("#copyBox").hidden = false; const ta = $("#copyText"); ta.value = reportTsv(); copyFrom(ta, "คัดลอกแล้ว วางใน Excel, Sheet หรือ LINE ได้"); break; }
    case "move": {
      const list = partiesOf(b.dataset.pk), i = +b.dataset.i, j = i + (+b.dataset.dir);
      if (j < 0 || j >= list.length) return;
      [list[i], list[j]] = [list[j], list[i]]; render(); saveConfigToast("บันทึกลำดับแล้ว"); break;
    }
    case "addParty": {
      const k = b.dataset.pk, inp = $(k === "sale" ? "#newCust" : "#newFarm"), name = inp.value.trim();
      if (!name) { inp.focus(); return; }
      partiesOf(k).push({ id: uid(k === "sale" ? "c" : "f"), name, opening: 0, active: true });
      render(); saveConfigToast(`เพิ่ม ${name} แล้ว`); break;
    }
  }
});
$("#drawer").addEventListener("click", e => { if (e.target.id === "drawer") closeDetail(); });
document.addEventListener("keydown", e => {
  const id = e.target.id;
  if (e.key === "Escape") { if (!$("#modal").hidden) return; if (!$("#drawer").hidden) closeDetail(); else if (S.openId) closePanel(); }
  if (e.key === "Enter" && (id === "newCust" || id === "newFarm")) { e.preventDefault(); $(`[data-act="addParty"][data-pk="${id === "newCust" ? "sale" : "buy"}"]`).click(); }
  if (e.key === "Enter" && id === "pinInput") { e.preventDefault(); $('[data-act="pin"]').click(); }
  if (e.key === "Enter" && (id === "payAmt" || id === "payNote")) { e.preventDefault(); savePay(false); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.closest("#panel") && S.draft && t.dataset.f) {
    if (t.dataset.i != null) S.draft.loads[+t.dataset.i][t.dataset.f] = t.value; else S.draft[t.dataset.f] = t.value;
    S.dirty = true; updatePanelCalc();
  } else if (t.dataset.pf && S.pay) {
    if (t.dataset.pf === "total") { setTotal(S.pay, num(t.value)); renderPayInputs(); } else S.pay[t.dataset.pf] = t.value;
    updatePay();
  } else if (t.dataset.pr && S.pay) {
    // แก้ช่องรับ/ลดของวันนั้น (ช่องรับอาจเปลี่ยนตามลดให้)
    setPick(S.pay, t.dataset.key, t.dataset.pr, num(t.value)); renderPayInputs();
    updatePay();
  } else if (t.dataset.ef && S.expDraft) {
    S.expDraft[t.dataset.ef] = t.value;
    if (t.dataset.ef === "amount" && S.expDraft.err) { S.expDraft.err = ""; $("#eErr").hidden = true; }
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "cutFrom" || t.id === "cutTo") { updateCutSum(t.dataset.id); return; }
  if (t.id === "payDate" && S.pay) { if (t.value) { S.pay.date = t.value; renderPay(); } else t.value = S.pay.date; return; }
  // พิมพ์เสร็จแล้ว (ออกจากช่อง) โชว์ตัวเลขแบบมีลูกน้ำ
  if (S.pay && t.dataset.pf === "total") { S.pay.snap = null; t.value = inV(payTot(S.pay).r); return; }
  if (S.pay && t.dataset.pr) { const pk = S.pay.picks[t.dataset.key]; if (pk) t.value = inV(pk[t.dataset.pr]); return; }
  if (t.id === "sDev") { const v = t.value.trim().slice(0, 40); try { if (v) localStorage.setItem(LS_DEV, v); else localStorage.removeItem(LS_DEV); } catch (err) { /* storage blocked */ } t.value = devName(); toast(`เครื่องนี้ชื่อ "${devName()}" แล้ว`); return; }
  if (t.id === "dateInput" && t.value) changeDate(t.value);
  else if (t.dataset.price) {
    const ty = t.dataset.price, k = ty === "buy" ? "buy" : "sale", pk = k === "buy" ? "buyPrice" : priceKey("sale", ty), p = r2(num(t.value));
    if (!p) { t.value = priceOn(k, S.date, ty) || ""; return; }
    const day = S.days[S.date] || (S.days[S.date] = { date: S.date, lines: {}, buys: {} });
    day[pk] = p; S.dates = Object.keys(S.days).sort();
    if (S.draft) { S.draft.loads.forEach(x => { if (!num(x.w) && (k === "buy" || x.t === ty)) x.p = String(p); }); renderPanel(); }
    backend.writePrice(S.date, { [pk]: p }).then(() => toast(`ราคา${k === "buy" ? "ซื้อ" : ty}วันนี้ ${fmtN(p)} บาท/กก.`)).catch(() => toast("บันทึกราคาไม่สำเร็จ"));
  }
  else if (t.id === "sumFrom" || t.id === "sumTo") { if (t.value) { S[t.id] = t.value; render(); } }
  else if (t.dataset.ef === "cat" && S.expDraft) S.expDraft.cat = t.value;
  else if (t.dataset.sf) {
    const f = t.dataset.sf;
    if (f === "expenseCats") { const cats = t.value.split(",").map(x => x.trim()).filter(Boolean); if (!cats.length) { t.value = S.set.expenseCats.join(", "); return; } S.set.expenseCats = cats; }
    else if (f === "openingDate") { if (!t.value) return; S.set.openingDate = t.value; }
    else if (f === "weekStart") S.set.weekStart = +t.value;
    else if (f === "buyEnabled") { S.set.buyEnabled = t.checked; if (!t.checked && S.entryKind === "buy") S.entryKind = "sale"; render(); }
    else { const v = r2(num(t.value)); if (f === "defaultPrice" && !v) { t.value = S.set[f]; return; } S.set[f] = v; }
    saveConfigToast("บันทึกการตั้งค่าแล้ว");
  }
  else if (t.dataset.cf) {
    const p = partyById(t.dataset.pk, t.dataset.id); if (!p) return;
    const f = t.dataset.cf;
    if (f === "name") { const v = t.value.trim(); if (!v) { t.value = p.name; return; } p.name = v; }
    else if (f === "active") p.active = t.checked;
    else if (f === "rounds") { const v = Math.min(5, Math.max(1, Math.round(num(t.value)) || 1)); t.value = v; p.rounds = v; }
    else p[f] = r2(num(t.value));
    saveConfigToast("บันทึกแล้ว");
  }
});

/* ================= boot ================= */
function boot() {
  // gas = เปิดผ่านลิงก์ Apps Script · api = แอปบนมือถือ (GitHub Pages) · demo = เปิดไฟล์ตรงๆ
  S.mode = (window.google && google.script && google.script.run) ? "gas" : API_URL ? "api" : "demo";
  S.demo = S.mode === "demo";
  // ลิงก์ตั้งค่าเครื่อง: .../#k=รหัส → จำรหัสไว้ในเครื่อง แล้วลบออกจากแถบที่อยู่ ไม่ต้องพิมพ์
  const hk = location.hash.match(/^#k=(.+)$/);
  if (hk && !S.demo) { setPin(decodeURIComponent(hk[1])); try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { /* ignore */ } }
  S.pin = S.demo ? "" : getPin();
  if (!S.demo) S.outbox = (lsGet(LS_OUT, []) || []).filter(x => x && x.key && x.line);
  buildTabs(); setSync();
  if (S.demo) { DEMO = buildDemo(); $("#demoBar").hidden = false; }
  render(); loadAll(false);
  if (S.mode === "api" && "serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => { /* app still works without offline shell */ });
  }
}
boot();
})();
</script>
